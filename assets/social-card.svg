  <title id="title">치이카와 덕력고사 · 우리들의 덕력 소풍</title>
  <desc id="desc">연분홍 체크 바탕의 크림색 카드. 치이카와 덕력고사라는 제목과 직접 그린 꽃 인장 초대장, 랜덤 20문제 안내가 있는 비공식 팬 퀴즈 공유 이미지.</desc>
